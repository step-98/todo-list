{% extends "base.html" %}

{% block content %}
  <div class="card card-body blur shadow-blur mx-3 mx-md-4 mt-4 ">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="mb-0">Tags</h1>

      <a href="{% url 'tasks:tag-create' %}"
         class="btn btn-dark rounded-circle btn-lg">
        Add
      </a>
    </div>
    {% if tag_list %}
      <table class="table table-striped table-hover align-middle">
        <tr>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>

        {% for tag in tag_list %}
          <tr>
            <td>
              {{ tag.name }}
            </td>
            <td>
              <a href="{% url 'tasks:tag-update' pk=tag.id %}"
                 class="btn btn-secondary">
                UPDATE
              </a>
            </td>
            <td>
              <a href="{% url 'tasks:tag-delete' pk=tag.id %}"
                 class="btn btn-danger">
                DELETE
              </a>
            </td>
          </tr>
        {% endfor %}
      </table>
    {% else %}
      <p>There are no tags!</p>
    {% endif %}
  </div>
{% endblock %}
